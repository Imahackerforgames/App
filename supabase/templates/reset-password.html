<!--
  Reset password email.

  THIS IS A COPY OF WHAT IS LIVE. It is already pasted into Supabase under
  Authentication → Emails → Templates → Reset password. If you change this
  file, paste it in again or the two drift apart — which is what happened
  before: the template only existed in a chat message and was lost.

  Why it is written the way it is:

  • Tables, inline styles, no <style> block, no classes, no SVG. Gmail and
    Outlook strip all of those. This is the only layout that survives.

  • The black is declared four ways on every single cell — bgcolor, the
    `background` attribute, a CSS background image, and color-scheme:dark.
    That is not belt-and-braces for its own sake: Gmail's dark mode
    recolours background *colours* and leaves background *images* alone, so
    the repeating tile is what actually holds the black.

  • Images are absolute URLs on www.reamp.store. An email cannot use a
    relative path. If the domain ever changes, these change with it.

  • {{ .ConfirmationURL }} is Supabase's own variable. Do not rename it or
    wrap it — the whole reset flow depends on it arriving intact.
-->
<div style="color-scheme:dark;supported-color-schemes:dark;background:#000000;">
<table width="100%" cellpadding="0" cellspacing="0" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="background:#000000 url('https://www.reamp.store/email-bg.png') repeat;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="background:#000000 url('https://www.reamp.store/email-bg.png') repeat;padding:32px 16px;">

      <table width="100%" cellpadding="0" cellspacing="0" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="max-width:440px;background:#000000 url('https://www.reamp.store/email-bg.png') repeat;border:1px solid #241F24;border-radius:20px;">

        <tr><td align="center" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="background:#000000 url('https://www.reamp.store/email-bg.png') repeat;padding:32px 28px 22px;">
          <img src="https://www.reamp.store/email-logo.png" width="52" alt="Reamp" style="display:block;border:0;">
        </td></tr>

        <tr><td align="center" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="background:#000000 url('https://www.reamp.store/email-bg.png') repeat;padding:0 28px 12px;color:#FFFFFF;font-size:21px;font-weight:800;letter-spacing:-0.02em;">
          Reset your password
        </td></tr>

        <tr><td align="center" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="background:#000000 url('https://www.reamp.store/email-bg.png') repeat;padding:0 28px 26px;color:#C9C4C7;font-size:15px;line-height:1.6;">
          We got a request to reset your password. Tap below to choose a new one.
        </td></tr>

        <tr><td align="center" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="background:#000000 url('https://www.reamp.store/email-bg.png') repeat;padding:0 28px 26px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#E5142B;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700;padding:16px 38px;border-radius:999px;">
            Set a new password
          </a>
        </td></tr>

        <tr><td align="center" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="background:#000000 url('https://www.reamp.store/email-bg.png') repeat;padding:0 28px 18px;color:#8A8589;font-size:13px;line-height:1.6;">
          This link is good for one hour and only works once.<br>
          If you didn't ask for this, just ignore this email — nothing changes.
        </td></tr>

        <tr><td align="center" bgcolor="#000000" background="https://www.reamp.store/email-bg.png" style="background:#000000 url('https://www.reamp.store/email-bg.png') repeat;padding:18px 28px 32px;border-top:1px solid #241F24;color:#C9C4C7;font-size:14px;line-height:1.6;">
          Try not to forget it again 😄<br>
          <span style="color:#8A8589;font-size:13px;">— The Reamp team</span>
        </td></tr>

      </table>

    </td>
  </tr>
</table>
</div>
