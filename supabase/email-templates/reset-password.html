<!-- Supabase → Authentication → Emails → Reset Password → Message body.

     Brief: the logo, a button, one line of explanation. Luxury and simple.

     Luxury here is restraint and space, not ornament — generous padding, one
     accent colour, few words, nothing competing with the button. Everything
     that was not the logo, the sentence or the action has been removed.

     What stayed despite the brief, and why: the plain-text link under the
     button. "Works with no problem" is the requirement, and buttons are the
     part email clients break — some strip the background, some refuse the
     anchor styling entirely. Without a fallback, the person who hits that
     cannot reset their password at all, and they are by definition unable to
     tell you. It is small and quiet so it does not spoil the simplicity.

     Table layout and inline styles are mandatory: email clients drop <style>
     blocks, ignore flexbox and grid, and Outlook renders through Word.

     {{ .ConfirmationURL }} is filled in by Supabase. Leave it as-is. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#0D0F10;margin:0;padding:56px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;">

        <tr>
          <td align="center" style="padding-bottom:40px;">
            <img src="https://reamp.store/email-logo-white.png" width="46" height="42" alt="Reamp"
                 style="display:block;border:0;outline:none;text-decoration:none;color:#F5F1E8;font-size:20px;font-weight:700;">
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:34px;">
            <div style="font-size:15px;line-height:1.75;color:#9DA29C;">
              You asked to reset your Reamp password.<br>Choose a new one below.
            </div>
          </td>
        </tr>

        <tr>
          <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#FFFFFF" style="border-radius:10px;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:block;padding:16px 42px;font-size:15px;font-weight:600;color:#0D0F10;text-decoration:none;letter-spacing:0.2px;">Make a new password</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-top:38px;">
            <div style="border-top:1px solid #2B3033;"></div>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-top:22px;">
            <div style="font-size:12px;line-height:1.7;color:#6C736D;">
              Didn't ask for this? Ignore it — nothing changes.
            </div>
            <div style="font-size:11px;line-height:1.7;color:#4F554F;padding-top:14px;word-break:break-all;">
              Button not working? <a href="{{ .ConfirmationURL }}" style="color:#9DA29C;text-decoration:underline;">Open this link</a>
            </div>
            <div style="font-size:11px;color:#4F554F;padding-top:20px;letter-spacing:0.3px;">reamp.store</div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
