<!-- Supabase → Authentication → Emails → Reset Password → Message body.

     No background colour is set anywhere on purpose: the email takes whatever
     the client gives it, which is white almost everywhere. Black logo, black
     words, black button.

     The risk that buys: a client in dark mode supplies a dark surface, and
     black text on it is unreadable. Most clients auto-invert dark text when
     they do this, which covers it — but the alternative, hard-coding a white
     background, loses the look that was actually asked for. Worth knowing the
     trade rather than discovering it.

     Table layout and inline styles are mandatory: email clients drop <style>
     blocks, ignore flexbox and grid, and Outlook renders through Word.

     {{ .ConfirmationURL }} is filled in by Supabase. Leave it as-is. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0;padding:56px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;">

        <tr>
          <td align="center" style="padding-bottom:40px;">
            <img src="https://reamp.store/email-logo-black.png" width="46" height="42" alt="Reamp"
                 style="display:block;border:0;outline:none;text-decoration:none;color:#000000;font-size:20px;font-weight:700;">
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:34px;">
            <div style="font-size:15px;line-height:1.75;color:#000000;">
              You asked to reset your Reamp password.<br>Choose a new one below.
            </div>
          </td>
        </tr>

        <tr>
          <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#000000" style="border-radius:10px;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:block;padding:16px 42px;font-size:15px;font-weight:600;color:#FFFFFF;text-decoration:none;letter-spacing:0.2px;">Make a new password</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-top:38px;">
            <div style="border-top:1px solid #DDDDDD;"></div>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-top:22px;">
            <div style="font-size:12px;line-height:1.7;color:#000000;">
              Didn't ask for this? Ignore it — nothing changes.
            </div>
            <div style="font-size:11px;line-height:1.7;color:#555555;padding-top:14px;word-break:break-all;">
              Button not working? <a href="{{ .ConfirmationURL }}" style="color:#000000;text-decoration:underline;">Open this link</a>
            </div>
            <div style="font-size:11px;color:#555555;padding-top:20px;letter-spacing:0.3px;">reamp.store</div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
