<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Paints the browser chrome on Android and the iOS status bar area to
         match the app's own ground, so the page does not sit in a white
         frame it never asked for. -->
    <meta name="theme-color" content="#0B0A0B" />
    <meta name="description" content="Reamp — track what you buy, what you sell, and what you actually made." />
    <title>Reamp</title>
  </head>
  <!-- The default palette's ground, so the very first paint is not white.
       The app overrides this from the live theme as soon as it mounts. -->
  <body style="margin:0;background:#0D0F10">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
