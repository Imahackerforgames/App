<!-- Supabase → Authentication → Emails → Reset Password → Message body.

     Adapts to the reader's colour scheme: black words on light, white words
     on dark, a white button either way.

     HOW RELIABLE THIS IS, because it is the one thing in email that genuinely
     does not work everywhere. The adaptation is a @media (prefers-color-scheme)
     block. Apple Mail and iOS Mail honour it properly. Gmail usually ignores
     it and applies its own inversion instead, which lands somewhere between
     fine and ugly but stays readable. Outlook desktop ignores it entirely and
     shows the light version.

     So the inline styles are the light version on purpose — that is the
     fallback every client falls back TO, and it has to be the one that works
     unaided. The media query is an enhancement, never a requirement.

     The logo is the original red for the same reason: red is legible on white
     and on near-black, so it needs no swapping and cannot vanish. Swapping two
     images by CSS is the usual trick and it is exactly what Gmail breaks.

     The button is white with a thin dark border. White alone is invisible on
     a light surface; the border is what makes "white button" survive the case
     it would otherwise disappear in.

     {{ .ConfirmationURL }} is filled in by Supabase. Leave it as-is. -->
<style>
  @media (prefers-color-scheme: dark) {
    .rm-text { color: #FFFFFF !important; }
    .rm-muted { color: #BBBBBB !important; }
    .rm-rule { border-color: #3A3A3A !important; }
    .rm-btn { border-color: #FFFFFF !important; }
  }
</style>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0;padding:56px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:420px;">

        <tr>
          <td align="center" style="padding-bottom:40px;">
            <img src="https://reamp.store/email-logo.png" width="46" height="42" alt="Reamp"
                 style="display:block;border:0;outline:none;text-decoration:none;">
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:34px;">
            <div class="rm-text" style="font-size:15px;line-height:1.75;color:#000000;">
              You asked to reset your Reamp password.<br>Choose a new one below.
            </div>
          </td>
        </tr>

        <tr>
          <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="rm-btn" align="center" bgcolor="#FFFFFF" style="border-radius:10px;border:1px solid #111111;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:block;padding:15px 41px;font-size:15px;font-weight:600;color:#000000;text-decoration:none;letter-spacing:0.2px;">Make a new password</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-top:38px;">
            <div class="rm-rule" style="border-top:1px solid #DDDDDD;"></div>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-top:22px;">
            <div class="rm-text" style="font-size:12px;line-height:1.7;color:#000000;">
              Didn't ask for this? Ignore it — nothing changes.
            </div>
            <div class="rm-muted" style="font-size:11px;line-height:1.7;color:#555555;padding-top:14px;word-break:break-all;">
              Button not working? <a class="rm-text" href="{{ .ConfirmationURL }}" style="color:#000000;text-decoration:underline;">Open this link</a>
            </div>
            <div class="rm-muted" style="font-size:11px;color:#555555;padding-top:20px;letter-spacing:0.3px;">reamp.store</div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
